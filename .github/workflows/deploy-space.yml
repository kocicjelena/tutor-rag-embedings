# Push this repo to the Hugging Face Space.
#
# One repo, one direction: GitHub is the source, the Space is a destination.
# Never edit the Space's own git repo — the next run overwrites it.
#
# Before the first run, two things must exist:
#   1. GitHub → Settings → Secrets → Actions → new secret `HF_TOKEN`
#      (a WRITE token from https://huggingface.co/settings/tokens)
#   2. The Space itself, created once at https://huggingface.co/new-space
#      with SDK = Docker. Set HF_SPACE below to "<owner>/<space-name>".
#
# The Space is PUBLIC even when this repo is private, so anything pushed here
# is published. The "Build the Space tree" step is what keeps that deliberate.

name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: false

env:
  # ── SET THIS ─────────────────────────────────────────────
  HF_SPACE: your-hf-username/mcp-py

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish anything that should not be public
        run: |
          set -euo pipefail
          fail=0

          # Belt and braces. These are all gitignored, so none of them should
          # ever appear in a checkout — which is exactly why their appearance
          # means something has gone wrong upstream and the deploy must stop.
          for path in .env .env.local .env.production rag.db related; do
            if [ -e "$path" ]; then
              echo "::error::$path is in the checkout — refusing to publish"
              fail=1
            fi
          done

          # Hugging Face requires Git LFS above 10 MB. Failing here is far
          # better than a push that is rejected halfway.
          #
          # Process substitution, not a pipe: a `while` on the right of a pipe
          # runs in a subshell, so `fail=1` would be lost and this check would
          # silently always pass.
          while IFS= read -r f; do
            echo "::error::$f is over 10 MB — needs Git LFS on the Space"
            fail=1
          done < <(find . -path ./.git -prune -o -type f -size +10M -print)

          exit "$fail"

      - name: Build the Space tree
        run: |
          set -euo pipefail

          # Not published, even though this repo is private. Each line is a
          # decision, so add to it deliberately rather than by habit.
          rm -rf .claude          # local tooling config, plus Jelena's own rules
          rm -rf .github          # CI belongs to GitHub, not to the Space
          rm -f  .CLAUDE.md       # the original brief — hers
          rm -f  other_agent.md   # the defect inventory: all fixed, still not a public document

          # Defensive: both are gitignored, so neither should ever be in a
          # checkout. If that ever changes, these are the lines that stop it
          # reaching the internet. docs/ops/ matters most — it describes
          # Jelena's home network and what is exposed on it.
          rm -rf docs/jelena
          rm -rf docs/ops

          # The Space's front page needs YAML front matter that would look like
          # rubbish at the top of the GitHub README. Kept as its own file so it
          # is reviewable in a diff rather than generated by string surgery.
          test -f deploy/space-README.md
          cp deploy/space-README.md README.md
          rm -rf deploy

          test -f Dockerfile || {
            echo "::error::No Dockerfile — the Space has nothing to build."
            exit 1
          }

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN is not set. See the header of this file."
            exit 1
          fi

          # A fresh single commit, force-pushed. The Space keeps no history
          # worth preserving — this repo is the history — and it keeps the
          # Space small and every deploy identical to a clean checkout.
          rm -rf .git
          git init -q -b main
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      - name: Where it went
        run: echo "https://huggingface.co/spaces/${HF_SPACE}"

# Push this repo to the Hugging Face Space.
#
# One repo, one direction: GitHub is the source, the Space is a destination.
# Never edit the Space's own git repo — the next run overwrites it.
#
# There is NO `HF_TOKEN` secret. The Space at huggingface.co/spaces/kjelenak/my_tutor
# has this repository configured as a **trusted publisher**, so the job proves
# who it is with GitHub's OIDC token and gets back a Hugging Face token that
# lives one hour and can write to that one Space and nothing else. Set up on the
# Hub side, 2026-07-31; the full walk-through is .claude/rules/MANUAL-GITHUB.md.
#
# Three things it depends on, and each one fails the whole run if it drifts:
#   1. `permissions: id-token: write` below — without it GitHub mints no OIDC
#      token and there is nothing to exchange.
#   2. The claims on the Hub are matched EXACTLY, no prefixes, no wildcards. If
#      `branch` or `workflow` were filled in there, they must read `main` and
#      `deploy-space.yml` — rename this file and the deploy stops.
#   3. `HF_OIDC_RESOURCE` must carry the `spaces/` prefix. Without it the Hub
#      looks for a *model* repo of that name and answers `invalid_grant`.
#
# The Space is PUBLIC even when this repo is private, so anything pushed here
# is published. The "Build the Space tree" step is what keeps that deliberate.

name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: false

env:
  HF_SPACE: kjelenak/my_tutor

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required: this is what the Hub exchanges for a token
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Refuse to publish anything that should not be public
        run: |
          set -euo pipefail
          fail=0

          # Belt and braces. These are all gitignored, so none of them should
          # ever appear in a checkout — which is exactly why their appearance
          # means something has gone wrong upstream and the deploy must stop.
          for path in .env .env.local .env.production rag.db related; do
            if [ -e "$path" ]; then
              echo "::error::$path is in the checkout — refusing to publish"
              fail=1
            fi
          done

          # Hugging Face requires Git LFS above 10 MB. Failing here is far
          # better than a push that is rejected halfway.
          #
          # Process substitution, not a pipe: a `while` on the right of a pipe
          # runs in a subshell, so `fail=1` would be lost and this check would
          # silently always pass.
          while IFS= read -r f; do
            echo "::error::$f is over 10 MB — needs Git LFS on the Space"
            fail=1
          done < <(find . -path ./.git -prune -o -type f -size +10M -print)

          exit "$fail"

      - name: Build the Space tree
        run: |
          set -euo pipefail

          # Not published, even though this repo is private. Each line is a
          # decision, so add to it deliberately rather than by habit.
          # `.claude/` now carries the working documents too (rules/*.md), so
          # this one line is what keeps the Space to its README and its code.
          # The defect inventory, the handoff and the plans go with it.
          rm -rf .claude          # tooling config, Jelena's rules, and .claude/rules/*.md
          rm -rf .github          # CI belongs to GitHub, not to the Space
          rm -f  .CLAUDE.md       # the original brief — hers

          # Defensive: both are gitignored, so neither should ever be in a
          # checkout. If that ever changes, these are the lines that stop it
          # reaching the internet. docs/ops/ matters most — it describes
          # Jelena's home network and what is exposed on it.
          rm -rf docs/jelena
          rm -rf docs/ops

          # The Space's front page needs YAML front matter that would look like
          # rubbish at the top of the GitHub README. Kept as its own file so it
          # is reviewable in a diff rather than generated by string surgery.
          test -f deploy/space-README.md
          cp deploy/space-README.md README.md
          rm -rf deploy

          test -f Dockerfile || {
            echo "::error::No Dockerfile — the Space has nothing to build."
            exit 1
          }

      - name: Install the hf CLI
        # The standalone installer, not `pip install huggingface_hub`: the OIDC
        # exchange needs >= 1.19.0 and this always gets it, with no Python
        # environment on the runner to reason about.
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: What this run claims to be
        # Diagnostic, and it prints CLAIMS — never the token itself. The Hub matches these
        # strings *exactly* against the trusted publisher configured on the Space, so an
        # `invalid_grant: No trusted publisher configured … matching this OIDC token` is
        # almost always one of these three differing from what is stored there:
        #
        #   repository  must be  kocicjelena/tutor-rag-embedings   (owner/name — NOT a URL)
        #   branch      must be  main                              (GitHub sends refs/heads/main)
        #   workflow    must be  deploy-space.yml                  (the FILE name)
        #
        # Note the mismatch this step makes visible: GitHub's raw `workflow` claim is the
        # workflow's *display name* ("Deploy to Hugging Face Space"); the file name only
        # appears inside `workflow_ref`. If a publisher with all three claims will not
        # match, configure `repository` alone first, prove the exchange works, then tighten.
        #
        # Deliberately cannot fail the deploy: a broken diagnostic must never be the reason
        # a good run stops.
        continue-on-error: true
        run: |
          set -uo pipefail
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fhuggingface.co" \
            | jq -r '.value // empty')"
          if [ -z "${token}" ]; then
            echo "No OIDC token — is 'permissions: id-token: write' still on this job?"
            exit 0
          fi
          # Decoded in Python rather than base64 + tr: the payload is base64url and its
          # padding is stripped, and getting that wrong in shell prints nothing and looks
          # like "there were no claims".
          printf '%s' "${token}" | python3 -c 'import base64, json, sys
          p = sys.stdin.read().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          wanted = ("repository", "repository_owner", "ref", "workflow", "workflow_ref", "sub", "aud")
          print(json.dumps({k: claims.get(k) for k in wanted}, indent=2))'

      - name: Push to the Space
        env:
          # The one thing the CLI needs from us. On GitHub Actions it mints the
          # OIDC token, calls huggingface.co/oauth/token, and uses the result —
          # no secret, nothing stored, expires in an hour.
          HF_OIDC_RESOURCE: spaces/${{ env.HF_SPACE }}
        run: |
          set -euo pipefail

          # The Space keeps no history worth preserving — this repo is the
          # history — so the upload is a straight mirror of the filtered tree.
          # `--delete "*"` is what makes it a mirror rather than an accretion:
          # anything on the Space that is not in this tree goes, which is how a
          # file removed from the repo also leaves the public Space.
          rm -rf .git
          hf upload "${HF_SPACE}" . . \
            --repo-type=space \
            --delete="*" \
            --commit-message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"

      - name: Where it went
        run: echo "https://huggingface.co/spaces/${HF_SPACE}"
